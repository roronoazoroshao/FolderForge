name: SSH operator feasibility
on:
  push:
    branches: [feat/ssh-verified-one-click-trusted-host]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-actual-ssh:
    name: Real OpenSSH UID and lease gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install OpenSSH client and server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-client openssh-server
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Assert real SSH evidence
        env:
          FOLDERFORGE_REQUIRE_SSH_E2E: '1'
        run: npx vitest run tests/acceptance/ssh-operator-feasibility.test.ts --reporter=verbose

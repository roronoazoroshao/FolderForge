name: Remove merged Trusted Host auth branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-branch-cleanup-20261011-auth.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'roronoazoroshao/FolderForge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete only the exact verified PR 81 head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='fix/local-trusted-host-intent-auth'
          expected='bf2d981fec9344c602b2efd5c4cae9a0f3f190ad'
          actual="$(gh api "repos/${REPO}/git/ref/heads/${branch}" --jq '.object.sha')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Branch tip changed; refusing deletion."
            exit 1
          fi
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"
          gh api "repos/${REPO}/branches?per_page=100" --jq '.[].name'

name: Preview scoped Fleet visual baselines

on:
  push:
    branches: ['feat/no-extension-dashboard-owner-oneclick']

permissions:
  contents: read

concurrency:
  group: fleet-baseline-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/folderforge-ci-chromium
      FF_VISUAL_REQUIRE_BROWSER: '1'
      FF_VISUAL_UPDATE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix packages/mission-control --ignore-scripts
      - name: Build SPA and runtime
        run: |
          npm run build:adapter-godot
          npm run build:mission-control
      - name: Install pinned Playwright Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Generate ONLY Fleet desktop and mobile screenshots
        run: |
          npx vitest run tests/visual/spa-visual.test.ts -t "matches the baseline for fleet" --reporter=verbose
          git diff --name-only | sort > /tmp/changed.txt
          printf "tests/visual/baselines/fleet.desktop.png\ntests/visual/baselines/fleet.mobile.png\n" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          sha256sum tests/visual/baselines/fleet.{desktop,mobile}.png
      - name: Upload evidence for review only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reviewed-fleet-baseline-preview
          path: |
            tests/visual/baselines/fleet.desktop.png
            tests/visual/baselines/fleet.mobile.png
          retention-days: 7

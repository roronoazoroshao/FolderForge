name: Preview scoped Fleet visual baselines

on:
  push:
    branches: ['feat/no-extension-dashboard-owner-oneclick']

permissions:
  contents: write

concurrency:
  group: fleet-baseline-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/folderforge-ci-chromium
      FF_VISUAL_REQUIRE_BROWSER: '1'
      FF_VISUAL_UPDATE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix packages/mission-control --ignore-scripts
      - name: Build SPA and runtime
        run: |
          npm run build:adapter-godot
          npm run build:mission-control
      - name: Install pinned Playwright Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Generate ONLY Fleet desktop and mobile screenshots
        run: |
          npx vitest run tests/visual/spa-visual.test.ts -t "matches the baseline for fleet" --reporter=verbose
          git diff --name-only | sort > /tmp/changed.txt
          printf "tests/visual/baselines/fleet.desktop.png\ntests/visual/baselines/fleet.mobile.png\n" > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          sha256sum tests/visual/baselines/fleet.{desktop,mobile}.png
      - name: Upload evidence for review only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reviewed-fleet-baseline-preview
          path: |
            tests/visual/baselines/fleet.desktop.png
            tests/visual/baselines/fleet.mobile.png
          retention-days: 7
      - name: Commit exactly two visually reviewed Fleet baselines
        if: contains(github.event.head_commit.message, '[commit-reviewed-baselines]')
        run: |
          echo '7c4c33d47b90648cd735d8324cbc1670b8d30fbf65a31b26eaad9e453aa57c9e  tests/visual/baselines/fleet.desktop.png' > /tmp/reviewed.sha256
          echo 'b3cf03cab498cb88e87ea0659c97100450643e6081cf32b2e3a49a4bcd89b57a  tests/visual/baselines/fleet.mobile.png' >> /tmp/reviewed.sha256
          sha256sum --check /tmp/reviewed.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/visual/baselines/fleet.desktop.png tests/visual/baselines/fleet.mobile.png
          git diff --cached --name-only | sort > /tmp/staged.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git commit -m 'test(visual): record reviewed Fleet baselines (pinned Chromium)'
          git push origin HEAD:refs/heads/feat/no-extension-dashboard-owner-oneclick

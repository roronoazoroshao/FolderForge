name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example v2.3.2)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-github-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Verify tag, clean tree, package version, changelog, and exact commit
        run: node scripts/verify-release-ref.mjs --tag "${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"

      # Maintainer explicitly waived the 24-hour production soak gate.
      # Annotated tag, release metadata and exact-tag CI remain mandatory.
      - name: Require successful CI for exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch can load the latest workflow from a branch
          # while checking out an older immutable release tag.
          # GITHUB_SHA is not always the checked-out release source.
          release_sha="$(git rev-parse HEAD)"
          test "${#release_sha}" -eq 40

          ci_run_id="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${release_sha}" \
            -f status=success \
            -f per_page=100 \
            --jq '.workflow_runs[0].id // empty')"
          test -n "${ci_run_id}" || {
            echo "No successful ci.yml run exists for tagged commit ${release_sha}." >&2
            exit 1
          }
          echo "Exact-tag CI verified: ${release_sha} (run ${ci_run_id})"

      - name: Create GitHub release for verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "FolderForge ${version}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest

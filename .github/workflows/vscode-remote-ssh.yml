name: VS Code Remote-SSH verified handoff

on:
  push:
    branches: [main]
    paths:
      - 'packages/vscode-remote-ssh/**'
      - 'packages/mission-control/src/screens/Fleet.tsx'
      - 'src/operator/ssh-dashboard-launcher.ts'
      - 'src/operator/ssh-browser-channel.ts'
      - 'src/operator/ssh-local-bridge.ts'
      - 'src/operator/ssh-session-broker.ts'
      - 'src/dashboard/ssh-operator-session.ts'
      - '.github/workflows/vscode-remote-ssh.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/vscode-remote-ssh/**'
      - 'tests/unit/vscode-remote-ssh-bridge.test.ts'
      - 'tests/unit/vscode-remote-ssh-runtime.test.ts'
      - 'tests/unit/ssh-dashboard-launcher.test.ts'
      - 'tests/integration/ssh-local-bridge.test.ts'
      - 'tests/integration/dashboard-ssh-session.test.ts'
      - 'tests/integration/ssh-one-click-fleet.test.ts'
      - 'tests/acceptance/ssh-browser-handoff.test.ts'
      - 'packages/mission-control/src/screens/Fleet.tsx'
      - 'src/operator/ssh-dashboard-launcher.ts'
      - 'src/operator/ssh-browser-channel.ts'
      - 'src/operator/ssh-local-bridge.ts'
      - 'src/operator/ssh-session-broker.ts'
      - 'src/dashboard/ssh-operator-session.ts'
      - '.github/workflows/vscode-remote-ssh.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-ui:
    name: Verified remote UI, security contract and installable VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install tested source and frontend dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix packages/mission-control --ignore-scripts
      - name: Security regression for VS Code-owned SSH launcher
        run: |
          npx vitest run tests/unit/vscode-remote-ssh-bridge.test.ts \
            tests/unit/vscode-remote-ssh-runtime.test.ts \
            tests/unit/ssh-dashboard-launcher.test.ts \
            tests/integration/ssh-local-bridge.test.ts \
            --reporter=verbose
      - name: Verify production Mission Control builds with the VS Code link
        run: |
          npm run build:adapter-godot
          npm run build:mission-control
          test -s packages/mission-control/dist/index.html
      - name: Install actual Chromium for the verified owner browser handoff
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/folderforge-vscode-verified-browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify real owner cookie and Fleet enable/start/revoke E2E
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/folderforge-vscode-verified-browser
          FOLDERFORGE_REQUIRE_BROWSER_E2E: '1'
        run: npx vitest run tests/acceptance/ssh-browser-handoff.test.ts --reporter=verbose
      - name: Build installable local VS Code extension VSIX
        working-directory: packages/vscode-remote-ssh
        run: |
          npm exec --yes --package=@vscode/vsce@4.0.0 -- \
            vsce package --no-dependencies --out "${RUNNER_TEMP}/folderforge-remote-ssh-0.1.0.vsix"
      - name: Verify VSIX includes the actual extension and no source secrets
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          path = os.path.join(os.environ['RUNNER_TEMP'], 'folderforge-remote-ssh-0.1.0.vsix')
          with zipfile.ZipFile(path) as arc:
              names = set(arc.namelist())
              for required in ('extension/package.json', 'extension/src/extension.cjs',
                               'extension/src/core.cjs', 'extension/readme.md'):
                  assert required in names, f'Missing installed VSIX component {required}'
              meta = json.loads(arc.read('extension/package.json'))
              assert meta['extensionKind'] == ['ui']
              assert meta['publisher'] + '.' + meta['name'] == 'musashishao.folderforge-remote-ssh'
              assert all(not name.startswith('extension/node_modules/') for name in names)
          print('VSIX_VERIFY_PASS')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: folderforge-vscode-remote-ssh-vsix
          path: ${{ runner.temp }}/folderforge-remote-ssh-0.1.0.vsix
          if-no-files-found: error
          retention-days: 14

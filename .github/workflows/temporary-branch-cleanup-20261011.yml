name: Temporary cleanup of already-integrated branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-branch-cleanup-20261011.yml'

permissions:
  contents: write

concurrency:
  group: one-time-folderforge-branch-cleanup-20261011
  cancel-in-progress: false

jobs:
  prune-verified-branches:
    if: github.repository == 'roronoazoroshao/FolderForge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact branch tips before deleting them
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "feat/fleet-linux-trusted-host-consent"
            "feat/fleet-zero-config-trusted-host"
            "hotfix/fleet-security-closeout"
          )
          expected=(
            "4ee2383daf4b23de106378e202e0329e580a21cc"
            "017f2a4159e0d5efded38e495f47a84e124a0e39"
            "8c85e280ffa7b5f18796f2d1c729afda40b34607"
          )
          for i in "${!branches[@]}"; do
            actual="$(gh api "repos/${REPO}/git/ref/heads/${branches[i]}" --jq '.object.sha')"
            echo "${branches[i]}: expected=${expected[i]} actual=${actual}"
            if [[ "${actual}" != "${expected[i]}" ]]; then
              echo "::error::Branch changed since audit. Refusing cleanup."
              exit 1
            fi
          done
          for branch in "${branches[@]}"; do
            echo "Deleting verified integrated ref: ${branch}"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}" >/dev/null
          done
          echo "Remaining refs:"
          gh api "repos/${REPO}/branches?per_page=100" --jq '.[].name'

name: One-time pinned Fleet mobile visual baseline migration
on:
  push:
    branches: [fix/pinned-visual-ci-mobile-layout]
    paths: [.github/workflows/regenerate-visual-baselines-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    if: github.repository == 'roronoazoroshao/FolderForge'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/folderforge-ci-chromium
      FF_VISUAL_REQUIRE_BROWSER: '1'
      FF_VISUAL_SNAPSHOTS: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix packages/mission-control --ignore-scripts
      - name: Build production SPA
        run: |
          npm run build:adapter-godot
          npm run build:mission-control
          test -s packages/mission-control/dist/index.html
      - name: Install real locked Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: RED - prove viewport no longer scrolls past 390px
        run: npx vitest run tests/visual/spa-visual.test.ts -t "keeps .* inside the 390px mobile viewport" --reporter=verbose
      - name: Generate canonical image snapshots from actual responsive layout
        env:
          FF_VISUAL_UPDATE: '1'
        run: npx vitest run tests/visual/spa-visual.test.ts -t "matches the baseline for" --reporter=verbose
      - name: Prove all mobile screenshots are 390px wide, not 1380px
        run: |
          python3 - <<'PY'
          import struct, pathlib
          for name in ("fleet.mobile.png", "overview.mobile.png"):
              p = pathlib.Path("tests/visual/baselines") / name
              with p.open("rb") as f:
                  header = f.read(24)
              width, height = struct.unpack(">II", header[16:24])
              print(f"{name}: {width}x{height}")
              assert width == 390, f"{name} is not a genuine 390px mobile screenshot"
          PY
      - name: GREEN - rerun strict 0.2 percent baseline comparisons and responsive assertions
        run: npx vitest run tests/visual/spa-visual.test.ts --reporter=verbose
      - name: Audit changed snapshots (exact 12 existing screens only)
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only -- tests/visual/baselines | wc -l)" -gt 0
          test "$(git diff --name-only -- tests/visual/baselines | wc -l)" -le 12
          if git status --porcelain tests/visual/baselines | grep '^??'; then echo 'Unexpected new baseline file' >&2; exit 1; fi
          git diff --name-only -- tests/visual/baselines | while read -r f; do
            case "$f" in
              tests/visual/baselines/approvals.desktop.png|tests/visual/baselines/audit.desktop.png|tests/visual/baselines/fleet.desktop.png|tests/visual/baselines/fleet.mobile.png|tests/visual/baselines/overview.desktop.png|tests/visual/baselines/overview.mobile.png|tests/visual/baselines/plugins.desktop.png|tests/visual/baselines/responses.desktop.png|tests/visual/baselines/settings.desktop.png|tests/visual/baselines/tools.desktop.png|tests/visual/baselines/tunnels.desktop.png|tests/visual/baselines/workspaces.desktop.png) ;;
              *) echo "Unexpected changed image: $f" >&2; exit 1;;
            esac
          done
          git diff --stat -- tests/visual/baselines
      - name: Upload original-source screenshots for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: canonical-mobile-390px-and-desktop-screenshots
          path: tests/visual/baselines/*.png
          retention-days: 30
          if-no-files-found: error
      - name: Commit audited screenshots and delete temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual/baselines/*.png
          git rm .github/workflows/regenerate-visual-baselines-once.yml
          git diff --cached --check
          git commit -m 'test(visual): migrate 390px responsive snapshots to pinned Chromium'
          git push origin HEAD:refs/heads/fix/pinned-visual-ci-mobile-layout

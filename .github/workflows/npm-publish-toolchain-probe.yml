name: npm publish pack fixture toolchain probe
on:
  push:
    branches: [fix/npm-publish-npm12-pack-compat-20261016]
    paths: [.github/workflows/npm-publish-toolchain-probe.yml]
permissions:
  contents: read
jobs:
  compare-npm:
    strategy:
      fail-fast: false
      matrix:
        npm: ['11.6.2', '12.0.1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install candidate npm CLI and source dependencies
        run: |
          npm install --global npm@${{ matrix.npm }}
          node --version
          npm --version
          npm ci --ignore-scripts
      - name: Exercise real release provenance fixtures (not mocks)
        run: npx vitest run tests/unit/release-provenance.test.ts --reporter=verbose

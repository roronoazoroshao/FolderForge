name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-pixels:
    name: Pinned Chromium visual baseline and responsive layout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/folderforge-ci-chromium
      FF_VISUAL_REQUIRE_BROWSER: '1'
      FF_VISUAL_SNAPSHOTS: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix packages/mission-control --ignore-scripts
      - name: Build actual SPA and runtime
        run: |
          npm run build:adapter-godot
          npm run build:mission-control
          test -s packages/mission-control/dist/index.html
      - name: Install lockfile Playwright Chromium and system dependencies
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Run strict pixel diff and 390px viewport assertions
        run: npx vitest run tests/visual/spa-visual.test.ts --reporter=verbose

  compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies without lifecycle downloads
        run: |
          npm ci --ignore-scripts
          npm --prefix packages/mission-control ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        run: npm run architecture:check

      - name: Documentation and version checks
        run: npm run docs:check

      - name: Real container-runtime isolation (Docker, digest-pinned image)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          FOLDERFORGE_SANDBOX_IMAGE: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          FOLDERFORGE_REQUIRE_RUNTIME_TESTS: '1'
        run: |
          docker pull --quiet "$FOLDERFORGE_SANDBOX_IMAGE"
          npx vitest run tests/integration/sandbox-runtime.test.ts

      - name: Sandbox smoke runtime selection (routing-only, not containment evidence)
        run: npx vitest run tests/unit/smoke-sandbox.test.ts

      - name: macOS operator-state directory fsync feasibility (not power-loss evidence)
        if: matrix.os == 'macos-latest' && matrix.node == 22
        run: node scripts/feasibility-macos-directory-durability.mjs

      - name: Fleet reconnect recovery (orphan reaping, lease fencing)
        run: npx vitest run tests/unit/provisioner.test.ts

      - name: Audit durability failure injection
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          node -e "require('node:fs').mkdirSync('.folderforge-ci', { recursive: true })"
          npx vitest run tests/unit/audit-durability.test.ts --reporter=json --outputFile=.folderforge-ci/audit-durability.json

      - name: Preserve audit durability evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audit-durability-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .folderforge-ci/audit-durability.json

      - name: Evidence integrity and release provenance corpus
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx vitest run tests/unit/evidence-store.test.ts tests/unit/release-integrity.test.ts tests/unit/release-provenance.test.ts --reporter=json --outputFile=.folderforge-ci/evidence-integrity.json

      - name: Preserve evidence integrity results
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidence-integrity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .folderforge-ci/evidence-integrity.json

      - name: Test
        if: matrix.os != 'windows-latest'
        run: npm test

      - name: Windows danger-mode regression
        if: matrix.os == 'windows-latest'
        run: |
          npx vitest run tests/unit/policy-pipeline.test.ts tests/unit/policy-as-code.test.ts tests/integration/policy-explain.test.ts tests/unit/provisioner.test.ts tests/integration/dashboard-fleet.test.ts
          npx vitest run tests/integration/git-ops.test.ts -t "danger mode skips"
          npx vitest run tests/unit/openai-tunnel.test.ts -t "without critical bypass|deprecated no-op"

      - name: Coverage regression gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage

      - name: Property and fuzz checks
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:fuzz

      - name: Child MCP heartbeat stress
        if: matrix.node == 22 && matrix.os != 'windows-latest'
        env:
          FOLDERFORGE_STRESS_RUNS: '25'
        run: npm run test:stress

      - name: Build
        run: npm run build

      - name: Containerized child MCP boundary smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          FOLDERFORGE_SANDBOX_IMAGE: python@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
        run: |
          docker pull --quiet "$FOLDERFORGE_SANDBOX_IMAGE"
          npm run smoke:sandbox

      - name: Child MCP compatibility corpus
        if: matrix.node == 22 && matrix.os != 'windows-latest'
        run: node scripts/child-mcp-compatibility.mjs --output .folderforge-ci/child-mcp-compatibility.json

      - name: Preserve child MCP compatibility evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: child-mcp-compatibility-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .folderforge-ci/child-mcp-compatibility.json

      - name: Pinned third-party child MCP compatibility
        if: matrix.node == 22
        run: node scripts/child-mcp-third-party.mjs --output .folderforge-ci/child-mcp-third-party.json

      - name: Preserve third-party child MCP evidence
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: child-mcp-third-party-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .folderforge-ci/child-mcp-third-party.json

      - name: Concurrent audit writer stress
        if: matrix.node == 22 && matrix.os != 'windows-latest'
        run: npm run test:audit-concurrency

      - name: Evidence migration and tamper smoke
        if: matrix.node == 22 && matrix.os != 'windows-latest'
        run: node scripts/smoke-evidence.mjs

      - name: Resumable runtime soak smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/runtime-soak.mjs --output-dir .folderforge-ci/runtime-soak-smoke --duration-ms 5000 --interval-ms 250 --fault-every 5

      - name: Preserve runtime soak smoke evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-soak-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .folderforge-ci/runtime-soak-smoke/evidence.jsonl
            .folderforge-ci/runtime-soak-smoke/summary.json

      - name: Full-day soak evidence volume gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/test-runtime-soak-volume.mjs --output .folderforge-ci/runtime-soak-volume.json

      - name: Preserve soak volume evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-soak-volume-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .folderforge-ci/runtime-soak-volume.json

      - name: Five-minute onboarding smoke
        if: matrix.node == 22 && matrix.os != 'windows-latest'
        run: node scripts/smoke-onboarding.mjs

      - name: Godot adapter package smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run smoke:adapter-godot

      - name: Governance microbenchmark
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/run-governance-benchmarks.mjs --output .folderforge-ci/local-governance.json

      - name: Preserve governance benchmark evidence
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: governance-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: .folderforge-ci/local-governance.json

      - name: MCP Inspector conformance
        if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: node scripts/smoke-inspector.mjs

      - name: Pack, install tarball, and smoke CLI
        if: matrix.os != 'windows-latest'
        run: npm run smoke:package

      - name: Smoke stdio MCP with spaces and Unicode
        if: matrix.os != 'windows-latest'
        run: npm run smoke:stdio

      - name: Smoke authenticated HTTP MCP
        if: matrix.os != 'windows-latest'
        run: npm run smoke:http

      - name: Production dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --omit=dev

      - name: Full dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit
